<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Interview Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          body: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', '"SF Mono"', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { -webkit-font-smoothing: antialiased; }

  ::selection { background: rgba(99, 102, 241, 0.35); color: #fff; }

  /* message entrance */
  .msg-row { animation: rise 0.25s ease both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* typing dots */
  @keyframes bounce-dot {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }
  .bounce-dot { animation: bounce-dot 1.1s infinite ease-in-out; }

  /* subtle recording pulse */
  @keyframes pulse-dot {
    0%   { box-shadow: 0 0 0 0 rgba(129,140,248,0.45); }
    70%  { box-shadow: 0 0 0 8px rgba(129,140,248,0); }
    100% { box-shadow: 0 0 0 0 rgba(129,140,248,0); }
  }
  .rec-live { animation: pulse-dot 1.6s ease-out infinite; }

  /* scrollbar */
  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-track { background: transparent; }
  .chat-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }

  @media (prefers-reduced-motion: reduce) {
    .rec-live { animation: none; }
    .msg-row { animation: none; }
    .bounce-dot { animation: none; opacity: 0.7; }
  }
</style>
</head>
<body class="h-screen flex flex-col bg-slate-950 text-slate-100 font-body antialiased"
      style="background-image: radial-gradient(circle at 15% -10%, rgba(99,102,241,0.06), transparent 45%), radial-gradient(circle at 85% 0%, rgba(16,185,129,0.05), transparent 40%);">

  <!-- ==================== Header ==================== -->
  <header class="relative sticky top-0 z-10 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md">
    <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-indigo-500 via-emerald-400 to-indigo-500"></div>
    <div class="max-w-4xl mx-auto px-5 py-4 flex items-center justify-between gap-4 flex-wrap">
      <div class="flex items-center gap-3 min-w-0">
        <div class="relative flex-none w-10 h-10 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 border border-slate-700 flex items-center justify-center">
          <span id="recDot" class="w-2 h-2 rounded-full bg-slate-600 transition-all duration-300"></span>
        </div>
        <div class="min-w-0">
          <h1 class="font-display font-bold text-lg tracking-tight text-white whitespace-nowrap leading-tight">AI Interview Agent</h1>
          <p class="text-[11px] font-mono text-slate-500 leading-tight">v1.0 &bull; Powered by Llama 3.3 &amp; SQLite</p>
          <p id="candidateSub" class="text-xs text-slate-400 mt-0.5 truncate">Loading candidate&hellip;</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <span id="turnChip"
              class="inline-flex items-center font-mono text-[11px] text-slate-400 bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-full whitespace-nowrap">turn 0</span>
        <span id="statusChip"
              class="inline-flex items-center gap-1.5 font-mono text-[11px] tracking-wide px-2.5 py-1 rounded-full border whitespace-nowrap transition-colors border-indigo-500/40 bg-indigo-500/10 text-indigo-300">connecting&hellip;</span>
      </div>
    </div>
  </header>

  <!-- ==================== Chat area ==================== -->
  <main id="chatWrap" class="chat-scroll flex-1 overflow-y-auto scroll-smooth">
    <div id="chatInner" class="max-w-4xl mx-auto px-5 pt-7 pb-5 flex flex-col gap-4 min-h-full"></div>
  </main>

  <!-- Typing indicator: hidden by default, moved into #chatInner and unhidden by JS -->
  <div id="typingIndicator" class="hidden msg-row flex gap-2.5 justify-start">
    <div class="flex-none w-7 h-7 mt-0.5 rounded-lg flex items-center justify-center font-mono text-[11px] font-medium bg-slate-800 border border-indigo-500/30 text-indigo-400">AI</div>
    <div class="max-w-[68%] px-3.5 py-2.5 rounded-2xl rounded-tl-sm bg-slate-800 border border-slate-700 flex items-center gap-2.5">
      <span class="inline-flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 bounce-dot"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 bounce-dot" style="animation-delay:0.15s"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-slate-400 bounce-dot" style="animation-delay:0.3s"></span>
      </span>
      <span class="text-xs text-slate-400 font-mono">AI Interviewer is analyzing&hellip;</span>
    </div>
  </div>

  <!-- ==================== Composer ==================== -->
  <footer id="composer" class="border-t border-slate-800 bg-slate-900/80 backdrop-blur-md px-5 py-4 transition-opacity duration-200">
    <div class="max-w-4xl mx-auto flex items-end gap-2.5">
      <div class="flex-1 flex items-center bg-slate-800 border border-slate-700 rounded-xl pl-4 pr-1 py-1 transition-all duration-150 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/30">
        <input
          type="text"
          id="messageInput"
          placeholder="Type your answer&hellip;"
          autocomplete="off"
          disabled
          class="flex-1 bg-transparent border-none outline-none text-slate-100 placeholder-slate-500 text-[14.5px] py-2.5 disabled:text-slate-600"
        />
      </div>
      <button id="sendBtn" disabled aria-label="Send message"
              class="flex-none w-10 h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center transition-all duration-150 hover:bg-indigo-500 hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-900 disabled:opacity-35 disabled:cursor-not-allowed disabled:hover:translate-y-0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-[17px] h-[17px]">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p id="composerHint" class="max-w-4xl mx-auto mt-2 text-center font-mono text-[11px] text-slate-600">Press Enter to send</p>
  </footer>

<script>
(function () {
  "use strict";

  // -----------------------------------------------------------------------
  // Configuration — adjust to match your FastAPI deployment
  // -----------------------------------------------------------------------
  const API_URL = "/api/interview"; // relative path; change to absolute URL if backend is hosted separately

  // Demo candidate payload matching CandidateProfile schema from technical-spec.md.
  // Swap this out for a real candidate object (e.g. loaded from your own auth/session flow).
  const CANDIDATE = {
    member: {
      id: "CAND-001",
      name: "Sarah Johnson",
      jobRole: "Senior Data Engineer",
      yearsExperience: 9,
      education: "MS Computer Science",
      status: "COMPLETED"
    },
    missions: [
      { day: 7, title: "Embeddings Explained", passed: true, attempts: 1 },
      { day: 8, title: "Vector Databases Overview", passed: true, attempts: 1 },
      { day: 10, title: "Retrieval & Matching Engine", passed: true, attempts: 2 },
      { day: 12, title: "Prompt Engineering Fundamentals", passed: true, attempts: 4 },
      { day: 16, title: "Chatbot Backend & API Integration", passed: true, attempts: 1 },
      { day: 22, title: "Multi-Agent Orchestration", passed: true, attempts: 2 },
      { day: 23, title: "Model Context Protocol (MCP)", passed: true, attempts: 2 },
      { day: 28, title: "Docker & Kubernetes Deployment", passed: true, attempts: 3 },
      { day: 29, title: "Monitoring, Logging & Observability", skipped: true },
      { day: 31, title: "Capstone Project & Final Demo", passed: true, attempts: 1 }
    ],
    signals: { commitDays: 28, missionsCompleted: 30, missionsFirstTry: 20 }
  };

  const sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

  // -----------------------------------------------------------------------
  // DOM refs
  // -----------------------------------------------------------------------
  const chatInner       = document.getElementById("chatInner");
  const chatWrap         = document.getElementById("chatWrap");
  const input             = document.getElementById("messageInput");
  const sendBtn           = document.getElementById("sendBtn");
  const recDot            = document.getElementById("recDot");
  const statusChip        = document.getElementById("statusChip");
  const turnChip          = document.getElementById("turnChip");
  const candidateSub      = document.getElementById("candidateSub");
  const composer          = document.getElementById("composer");
  const composerHint      = document.getElementById("composerHint");
  const typingIndicator   = document.getElementById("typingIndicator");

  let turnCount = 0;
  let interviewDone = false;

  candidateSub.textContent =
    `${CANDIDATE.member.name} · ${CANDIDATE.member.jobRole} · ${CANDIDATE.member.yearsExperience}y exp`;

  // -----------------------------------------------------------------------
  // Style constants
  // -----------------------------------------------------------------------
  const CHIP_BASE = "inline-flex items-center gap-1.5 font-mono text-[11px] tracking-wide px-2.5 py-1 rounded-full border whitespace-nowrap transition-colors";
  const DOT_BASE  = "w-2 h-2 rounded-full transition-all duration-300";

  const AVATAR_USER = "flex-none w-7 h-7 mt-0.5 rounded-lg flex items-center justify-center font-mono text-[11px] font-medium bg-slate-800 border border-slate-700 text-slate-400";
  const AVATAR_AI   = "flex-none w-7 h-7 mt-0.5 rounded-lg flex items-center justify-center font-mono text-[11px] font-medium bg-slate-800 border border-indigo-500/30 text-indigo-400";

  const BUBBLE_USER = "max-w-[68%] px-3.5 py-2.5 rounded-2xl rounded-tr-sm text-[14.5px] leading-relaxed whitespace-pre-wrap break-words bg-indigo-600 border border-indigo-500 text-white transition-colors duration-150 hover:bg-indigo-500";
  const BUBBLE_AI   = "max-w-[68%] px-3.5 py-2.5 rounded-2xl rounded-tl-sm text-[14.5px] leading-relaxed whitespace-pre-wrap break-words bg-slate-800 border border-slate-700 text-slate-200 transition-colors duration-150 hover:border-slate-600";

  // -----------------------------------------------------------------------
  // Rendering helpers
  // -----------------------------------------------------------------------

  function scrollToBottom() {
    requestAnimationFrame(() => { chatWrap.scrollTop = chatWrap.scrollHeight; });
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function addSystemNote(text) {
    const row = document.createElement("div");
    row.className = "msg-row flex justify-center";
    row.innerHTML = `<div class="border border-dashed border-slate-700 text-slate-500 text-xs font-mono rounded-full px-3.5 py-1.5">${escapeHtml(text)}</div>`;
    chatInner.appendChild(row);
    scrollToBottom();
    return row;
  }

  function addMessage(role, text) {
    const row = document.createElement("div");
    row.className = `msg-row flex gap-2.5 max-w-full ${role === "user" ? "justify-end" : "justify-start"}`;

    const avatar = document.createElement("div");
    avatar.className = role === "user" ? AVATAR_USER : AVATAR_AI;
    avatar.textContent = role === "user" ? "YOU" : "AI";

    const bubble = document.createElement("div");
    bubble.className = role === "user" ? BUBBLE_USER : BUBBLE_AI;
    bubble.textContent = text;

    if (role === "user") {
      row.appendChild(bubble);
      row.appendChild(avatar);
    } else {
      row.appendChild(avatar);
      row.appendChild(bubble);
    }

    chatInner.appendChild(row);
    scrollToBottom();
    return row;
  }

  function showTyping() {
    typingIndicator.classList.remove("hidden");
    chatInner.appendChild(typingIndicator); // pin to bottom of the transcript
    scrollToBottom();
  }

  function hideTyping() {
    typingIndicator.classList.add("hidden");
    if (typingIndicator.parentNode) typingIndicator.remove();
  }

  function renderFeedbackReport(feedback) {
    const row = document.createElement("div");
    row.className = "msg-row flex justify-start w-full";

    const card = document.createElement("div");
    card.className = "relative w-full overflow-hidden rounded-2xl border border-slate-700 bg-slate-900/90 backdrop-blur-md shadow-2xl p-5 sm:p-6";

    const list = (items, itemClass) =>
      (items || []).map(i => `<li class="${itemClass}">${escapeHtml(i)}</li>`).join("");

    const strengthItem = "text-[13.5px] leading-snug text-emerald-100/90 bg-emerald-950/40 border border-emerald-900/30 rounded-lg px-2.5 py-2";
    const gapItem       = "text-[13.5px] leading-snug text-amber-100/90 bg-amber-950/40 border border-amber-900/30 rounded-lg px-2.5 py-2";
    const nextItem       = "text-[13.5px] leading-snug text-indigo-100/90 bg-indigo-950/40 border border-indigo-900/30 rounded-lg px-2.5 py-2";

    card.innerHTML = `
      <div class="absolute top-0 left-0 right-0 h-0.5 bg-gradient-to-r from-indigo-500 via-emerald-400 to-indigo-500"></div>
      <p class="font-mono text-[11px] uppercase tracking-wider text-indigo-400 mb-2">Interview complete &middot; Feedback report</p>
      <p class="text-[15px] leading-relaxed text-slate-100 mb-5">${escapeHtml(feedback.summary || "")}</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
        <div class="rounded-xl border border-emerald-900/40 bg-emerald-950/30 p-3.5">
          <h4 class="flex items-center gap-1.5 font-display text-xs uppercase tracking-wide text-emerald-400 mb-2">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Strengths
          </h4>
          <ul class="flex flex-col gap-1.5">${list(feedback.strengths, strengthItem)}</ul>
        </div>
        <div class="rounded-xl border border-amber-900/40 bg-amber-950/30 p-3.5">
          <h4 class="flex items-center gap-1.5 font-display text-xs uppercase tracking-wide text-amber-400 mb-2">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Gaps
          </h4>
          <ul class="flex flex-col gap-1.5">${list(feedback.gaps, gapItem)}</ul>
        </div>
        <div class="sm:col-span-2 rounded-xl border border-indigo-900/40 bg-indigo-950/30 p-3.5">
          <h4 class="flex items-center gap-1.5 font-display text-xs uppercase tracking-wide text-indigo-300 mb-2">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>Next steps
          </h4>
          <ul class="flex flex-col gap-1.5">${list(feedback.next, nextItem)}</ul>
        </div>
      </div>
    `;

    row.appendChild(card);
    chatInner.appendChild(row);
    scrollToBottom();
  }

  function setStatus(state) {
    if (state === "connecting") {
      statusChip.textContent = "connecting…";
      statusChip.className = `${CHIP_BASE} border-indigo-500/40 bg-indigo-500/10 text-indigo-300`;
      recDot.className = `${DOT_BASE} bg-slate-600`;
    } else if (state === "live") {
      statusChip.textContent = "in progress";
      statusChip.className = `${CHIP_BASE} border-indigo-500/40 bg-indigo-500/10 text-indigo-300`;
      recDot.className = `${DOT_BASE} bg-indigo-400 rec-live shadow-[0_0_8px_rgba(129,140,248,0.6)]`;
    } else if (state === "done") {
      statusChip.textContent = "complete";
      statusChip.className = `${CHIP_BASE} border-emerald-500/40 bg-emerald-500/10 text-emerald-300`;
      recDot.className = `${DOT_BASE} bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.6)]`;
    } else if (state === "error") {
      statusChip.textContent = "connection error";
      statusChip.className = `${CHIP_BASE} border-red-500/40 bg-red-500/10 text-red-300`;
      recDot.className = `${DOT_BASE} bg-slate-600`;
    }
  }

  function setComposerEnabled(enabled) {
    input.disabled = !enabled;
    sendBtn.disabled = !enabled;
    if (enabled) input.focus();
  }

  function lockComposerForCompletion() {
    setComposerEnabled(false);
    input.placeholder = "Interview complete";
    composerHint.textContent = "This interview session has ended";
    composer.style.opacity = "0.7";
  }

  // -----------------------------------------------------------------------
  // Networking
  // -----------------------------------------------------------------------

  async function postToBackend(body) {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const detail = await res.text().catch(() => "");
      throw new Error(`Backend responded ${res.status}: ${detail || res.statusText}`);
    }
    return res.json();
  }

  async function startInterview() {
    setStatus("connecting");
    try {
      const data = await postToBackend({ sessionId, candidate: CANDIDATE });
      addMessage("assistant", data.reply);
      setStatus("live");
      setComposerEnabled(true);
    } catch (err) {
      console.error(err);
      addSystemNote("Couldn't reach the interview backend. Check that the API is running and reachable at " + API_URL + ".");
      setStatus("error");
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || interviewDone) return;

    addMessage("user", text);
    input.value = "";
    setComposerEnabled(false);
    showTyping();

    try {
      const data = await postToBackend({ sessionId, message: text });
      hideTyping();

      turnCount += 1;
      turnChip.textContent = `turn ${turnCount}`;

      if (data.done) {
        interviewDone = true;
        addMessage("assistant", data.reply);
        if (data.feedback) renderFeedbackReport(data.feedback);
        setStatus("done");
        lockComposerForCompletion();
      } else {
        addMessage("assistant", data.reply);
        setComposerEnabled(true);
      }
    } catch (err) {
      console.error(err);
      hideTyping();
      addSystemNote("Message failed to send — network or server error. Try again.");
      setComposerEnabled(true);
    }
  }

  // -----------------------------------------------------------------------
  // Events
  // -----------------------------------------------------------------------

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  startInterview();
})();
</script>

</body>
</html>
